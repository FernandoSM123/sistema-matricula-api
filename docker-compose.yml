# Servicios de apoyo para desarrollo local: base de datos y servidor de correo de pruebas.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: matricula
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "2525:25"   # SMTP
      - "5080:80"   # Bandeja web: http://localhost:5080

volumes:
  postgres-data:
